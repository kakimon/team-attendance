# OLD address (GitHub Pages): publishes ONLY the notice page that points to the new address, and ONLY by hand.
# The app itself is no longer built or deployed here (it moved to Cloudflare Workers; see the internal publishing plan).
# There is deliberately no `push` trigger: syncing / pushing the public repository never changes what GitHub Pages serves,
# so the currently published old app stays as it is until this workflow is run on the switch-over day.
#   Actions > "GitHub Pages: notice page (manual)" > Run workflow > new_url = https://<new address>
name: 'GitHub Pages: notice page (manual)'
on:
  workflow_dispatch:
    inputs:
      new_url:
        description: 'New address of the app (https://..., no query). Required: the page is never built with a placeholder.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the notice page (refuses a placeholder or a non-https URL)
        run: node pages-notice/build.mjs "$NEW_URL" _site
        env:
          NEW_URL: ${{ inputs.new_url }}
      - name: Check the page (no placeholder, no app bundle)
        run: |
          ! grep -l "__NEW_URL__" _site/index.html _site/404.html
          test ! -d _site/_nuxt
          test -f _site/index.html && test -f _site/404.html && test -f _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 3
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
